name: Backend tests

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce_audit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ecommerce_audit_test
      DATABASE_SSL: "false"
      GROQ_API_KEY: test-only-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Verify production dependencies are fully pinned and hashed
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Audit Python dependencies for known vulnerabilities
        run: |
          python -m pip install pip-audit
          pip-audit --format json --output pip-audit.json
      - name: Record resolved Python dependency versions
        if: always()
        run: python -m pip freeze > resolved-dependencies.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Generate synthetic PDF report for layout review
        if: success()
        run: python scripts/generate_sample_audit_pdf.py --output audit-report-sample.pdf
      - name: Upload synthetic PDF layout artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-audit-report-pdf
          path: audit-report-sample.pdf
          if-no-files-found: warn
          retention-days: 14
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-dependency-audit
          path: |
            pip-audit.json
            resolved-dependencies.txt
          if-no-files-found: warn
          retention-days: 30
