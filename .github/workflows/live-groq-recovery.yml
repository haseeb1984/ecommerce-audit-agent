name: Live Groq model recovery smoke test

on:
  # A push event compares only the latest commit's changed paths. A PR path
  # filter compares the entire PR diff, which can rerun this live API test on
  # every unrelated update once a Groq file exists anywhere in the PR.
  push:
    branches: ["feature/**", "fix/**"]
    paths:
      - "ecommerce_agent.py"
      - "scripts/test_live_groq_recovery.py"
  workflow_dispatch:

jobs:
  live-groq-recovery:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Verify secret is configured
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY repository secret is missing; live recovery cannot be verified."
            exit 1
          fi
      - name: Test actual deprecated-model fallback against Groq
        run: python scripts/test_live_groq_recovery.py
