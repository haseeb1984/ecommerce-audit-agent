name: Durable scan worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durable-scan-worker
  cancel-in-progress: false

jobs:
  process-scan-queue:
    # Always start the job: missing deployment configuration must fail visibly
    # instead of silently skipping every scheduled invocation.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Validate worker configuration
        env:
          SCAN_WORKER_URL: ${{ vars.SCAN_WORKER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${SCAN_WORKER_URL:-}" ]]; then
            echo "Repository variable SCAN_WORKER_URL is not configured." >&2
            exit 1
          fi
          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "Repository secret CRON_SECRET is not configured." >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          import sys
          from urllib.parse import urlsplit

          value = os.environ["SCAN_WORKER_URL"].strip()
          try:
              parsed = urlsplit(value)
              valid = (
                  parsed.scheme == "https"
                  and bool(parsed.hostname)
                  and parsed.username is None
                  and parsed.password is None
                  and not parsed.fragment
                  and parsed.path.rstrip("/") == "/internal/scan-worker/run"
                  and (parsed.port is None or 1 <= parsed.port <= 65535)
                  and not any(character.isspace() for character in parsed.netloc)
              )
          except ValueError:
              valid = False
          if not valid:
              print(
                  "SCAN_WORKER_URL must be a valid HTTPS URL targeting "
                  "/internal/scan-worker/run, without embedded credentials or a fragment.",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY

      - name: Invoke protected scan worker
        env:
          SCAN_WORKER_URL: ${{ vars.SCAN_WORKER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body \
            --connect-timeout 10 --max-time 150 \
            --retry 2 --retry-delay 5 \
            --request GET \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$SCAN_WORKER_URL"
