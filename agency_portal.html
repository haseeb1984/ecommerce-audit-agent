<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agency Team Portal | Ecommerce Audit Agent</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172b42;background:#f3f6fa}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:960px;margin:48px auto;padding:0 20px}
header{margin-bottom:24px}h1{margin:0 0 8px;font-size:30px}p{color:#607187;line-height:1.55}
.panel{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:24px;margin:16px 0;box-shadow:0 6px 22px #17324d0a}
label{display:block;font-weight:650;margin:12px 0 6px}input,textarea{width:100%;max-width:620px;padding:12px;border:1px solid #b9c9da;border-radius:8px;font:inherit}textarea{min-height:110px;resize:vertical}
button{border:0;border-radius:8px;padding:11px 16px;background:#155a8a;color:#fff;font-weight:650;cursor:pointer;margin:12px 8px 0 0}
button.secondary{background:#e9f0f6;color:#24445f}button:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.workspace{border:1px solid #e0e8f0;border-radius:10px;padding:16px;margin:12px 0}.workspace h3{margin:0 0 4px}
.batch{padding:10px 0;border-top:1px solid #e8edf3}.muted{font-size:13px;color:#6b7c90}.status{margin-top:12px;min-height:22px;color:#155a8a}.hidden{display:none}
</style>
</head>
<body><main class="wrap">
<header><h1>Agency team portal</h1><p>Sign in with the email address your agency owner invited. You will only see client workspaces assigned to your account.</p></header>
<section class="panel" id="loginPanel">
<h2>Team member sign-in</h2>
<form id="requestForm"><label for="email">Invited email</label><input id="email" type="email" autocomplete="email" maxlength="254" required><button type="submit">Email me a sign-in code</button></form>
<form id="verifyForm" class="hidden"><label for="code">Six-digit sign-in code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button type="submit">Sign in</button></form>
<p class="status" id="loginStatus" role="status" aria-live="polite"></p>
</section>
<section class="panel hidden" id="workspacePanel">
<div class="row"><div><h2>Your client workspaces</h2><p id="identity" class="muted"></p></div><button id="logout" class="secondary">Sign out</button></div>
<div id="workspaces"><p class="muted">Loading assigned workspaces…</p></div>
<p class="status" id="workspaceStatus" role="status" aria-live="polite"></p>
</section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const tokenKey = "eaa_agency_team_session";
  let token = sessionStorage.getItem(tokenKey) || "";
  let sessionVersion = 0;
  let authAttemptVersion = 0;
  function assertCurrentSession(version) {
    if (version !== sessionVersion) throw new Error("Your agency session changed. Refresh the portal to continue.");
  }
  async function api(path, options = {}, expectedVersion = sessionVersion) {
    assertCurrentSession(expectedVersion);
    const requestToken = token;
    const response = await fetch(path, { ...options, cache:"no-store", headers:{
      ...(options.headers || {}), ...(requestToken ? {Authorization:"Bearer " + requestToken} : {})
    }});
    assertCurrentSession(expectedVersion);
    const data = await response.json().catch(() => ({}));
    assertCurrentSession(expectedVersion);
    if (!response.ok) throw new Error(data.detail || "The request could not be completed.");
    return data;
  }
  function showSignedOut() {
    sessionVersion += 1;
    authAttemptVersion += 1;
    token = ""; sessionStorage.removeItem(tokenKey);
    $("loginPanel").classList.remove("hidden"); $("workspacePanel").classList.add("hidden");
    $("verifyForm").classList.add("hidden");
    $("identity").textContent = "";
    $("workspaces").replaceChildren();
    $("workspaceStatus").textContent = "";
  }
  async function loadWorkspaces(expectedVersion = sessionVersion) {
    const data = await api("/api/v1/agency/team/workspaces", {}, expectedVersion);
    assertCurrentSession(expectedVersion);
    $("workspaces").replaceChildren();
    if (!data.items || !data.items.length) {
      const p=document.createElement("p");p.className="muted";p.textContent="No active client workspaces have been assigned to you."; $("workspaces").append(p);return;
    }
    for (const item of data.items) {
      const card=document.createElement("article");card.className="workspace";
      const heading=document.createElement("h3");heading.textContent=item.display_name;
      const role=document.createElement("p");role.className="muted";role.textContent="Your workspace role: "+item.role;
      const canSubmit=["admin","analyst"].includes(item.role);
      const submitForm=document.createElement("form");
      const urlsLabel=document.createElement("label");urlsLabel.textContent="Client page URLs (one URL per line)";
      const urlsInput=document.createElement("textarea");urlsInput.required=true;urlsInput.placeholder="https://client-store.example/\nhttps://client-store.example/products/example";
      urlsLabel.append(urlsInput);
      const submitButton=document.createElement("button");submitButton.type="submit";submitButton.textContent="Queue client audit";submitButton.disabled=!canSubmit;
      const permission=document.createElement("p");permission.className="muted";permission.textContent=canSubmit?"Audits use the agency's shared Business quota and must match the connected client website.":"Viewer access is read-only. Ask the agency owner for Analyst or Admin workspace access to submit audits.";
      submitForm.append(urlsLabel,submitButton,permission);
      submitForm.addEventListener("submit",async event=>{
        event.preventDefault();
        const actionVersion = sessionVersion;
        const urls=urlsInput.value.split(/\r?\n/).map(value=>value.trim()).filter(Boolean);
        if(!urls.length){$("workspaceStatus").textContent="Enter at least one client page URL.";return;}
        submitButton.disabled=true;$("workspaceStatus").textContent="Queueing client audit…";
        try{
          const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);
          const requestId="team-"+Array.from(bytes,value=>value.toString(16).padStart(2,"0")).join("");
          const result=await api("/api/v1/agency/team/workspaces/"+encodeURIComponent(item.id)+"/scan-batches",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({urls,request_id:requestId})},actionVersion);
          assertCurrentSession(actionVersion);
          urlsInput.value="";
          $("workspaceStatus").textContent="Queued "+result.submitted_urls+" URL(s) across "+result.batch_count+" batch(es) under the shared Business allowance.";
          button.click();
        }catch(error){if(actionVersion===sessionVersion)$("workspaceStatus").textContent=error.message;}
        finally{if(actionVersion===sessionVersion)submitButton.disabled=!canSubmit;}
      });
      const button=document.createElement("button");button.type="button";button.textContent="View audit history";
      const history=document.createElement("div");
      let historyOffset=0;
      let historyLoadMore=null;
      const historyPageSize=50;
      async function loadHistoryPage(offset, append) {
        const actionVersion=sessionVersion;
        button.disabled=true;
        if(historyLoadMore) historyLoadMore.disabled=true;
        if(!append) { history.replaceChildren(); historyOffset=0; }
        try {
          const result=await api("/api/v1/agency/team/workspaces/"+encodeURIComponent(item.id)+"/audits?limit="+historyPageSize+"&offset="+offset,{},actionVersion);
          assertCurrentSession(actionVersion);
          if(!append && !result.items.length) {
            const empty=document.createElement("p");empty.className="muted";empty.textContent="No audit batches are available yet.";history.append(empty);
          }
          for(const batch of result.items){
            const row=document.createElement("div");row.className="batch";
            const title=document.createElement("strong");title.textContent="Batch "+batch.batch_number+" · "+batch.status;
            const detail=document.createElement("p");detail.className="muted";detail.textContent=batch.total_urls+" URLs · "+batch.completed+" completed · "+batch.failed+" failed · "+(batch.created_at||"");
            const view=document.createElement("button");view.type="button";view.className="secondary";view.textContent="View saved findings";
            const evidence=document.createElement("div");
            view.addEventListener("click",async()=>{
              const evidenceVersion=sessionVersion;
              view.disabled=true;evidence.replaceChildren();
              try {
                const saved=await api("/api/v1/agency/team/workspaces/"+encodeURIComponent(item.id)+"/audit-results?batch_id="+encodeURIComponent(batch.id)+"&limit=25",{},evidenceVersion);
                assertCurrentSession(evidenceVersion);
                if(!saved.items.length){const empty=document.createElement("p");empty.className="muted";empty.textContent="No saved audit results are available yet.";evidence.append(empty);}
                for(const audit of saved.items){
                  const resultCard=document.createElement("div");resultCard.className="batch";
                  const resultTitle=document.createElement("strong");resultTitle.textContent=audit.url+" · "+audit.status;resultCard.append(resultTitle);
                  if(audit.result){
                    const score=document.createElement("p");score.className="muted";score.textContent="Score: "+(audit.result.overall_score??"N/A")+" · Findings: "+audit.result.finding_count;resultCard.append(score);
                    for(const finding of (Array.isArray(audit.result.findings)?audit.result.findings:[])){
                      const disclosure=document.createElement("details");
                      const summary=document.createElement("summary");summary.textContent=finding.title||finding.name||finding.check_id||"Audit finding";
                      const pre=document.createElement("pre");pre.style.whiteSpace="pre-wrap";pre.textContent=JSON.stringify(finding,null,2);
                      disclosure.append(summary,pre);resultCard.append(disclosure);
                    }
                  }else{const pending=document.createElement("p");pending.className="muted";pending.textContent="No saved result for this URL yet.";resultCard.append(pending);}
                  evidence.append(resultCard);
                }
              }catch(error){if(evidenceVersion===sessionVersion){const message=document.createElement("p");message.className="status";message.textContent=error.message;evidence.append(message);}}
              finally{if(evidenceVersion===sessionVersion)view.disabled=false;}
            });
            row.append(title,detail,view,evidence);history.append(row);
          }
          historyOffset=offset+result.items.length;
          if(historyLoadMore) historyLoadMore.remove();
          historyLoadMore=null;
          if(result.items.length===historyPageSize){
            historyLoadMore=document.createElement("button");
            historyLoadMore.type="button";historyLoadMore.className="secondary";historyLoadMore.textContent="Load older audit batches";
            historyLoadMore.addEventListener("click",()=>loadHistoryPage(historyOffset,true));
            history.append(historyLoadMore);
          }
        }catch(error){
          if(actionVersion===sessionVersion){const message=document.createElement("p");message.className="status";message.textContent=error.message;history.append(message);}
        }finally{
          if(actionVersion===sessionVersion){button.disabled=false;if(historyLoadMore)historyLoadMore.disabled=false;}
        }
      }
      button.addEventListener("click",()=>loadHistoryPage(0,false));
      card.append(heading,role,submitForm,button,history);$("workspaces").append(card);
    }
  }
  async function showSignedIn(expectedVersion = sessionVersion) {
    assertCurrentSession(expectedVersion);
    $("loginPanel").classList.add("hidden");$("workspacePanel").classList.remove("hidden");
    try {
      const me=await api("/api/v1/agency/team/auth/me",{},expectedVersion);
      assertCurrentSession(expectedVersion);
      $("identity").textContent=me.email+" · "+me.role;
      await loadWorkspaces(expectedVersion);
    } catch(error){if(expectedVersion===sessionVersion){$("workspaceStatus").textContent=error.message;showSignedOut();}}
  }
  $("requestForm").addEventListener("submit",async event=>{
    event.preventDefault();
    const actionVersion=sessionVersion;
    const attemptVersion=++authAttemptVersion;
    const button=$("requestForm").querySelector('button[type="submit"]');
    button.disabled=true;
    $("loginStatus").textContent="Sending code…";
    try {
      await api("/api/v1/agency/team/auth/request-code",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value.trim()})},actionVersion);
      assertCurrentSession(actionVersion);
      if(attemptVersion!==authAttemptVersion)return;
      $("verifyForm").classList.remove("hidden");
      $("loginStatus").textContent="If this email belongs to an accepted agency team member, a code has been sent.";
    } catch(error) {
      if(actionVersion===sessionVersion&&attemptVersion===authAttemptVersion)$("loginStatus").textContent=error.message;
    } finally {
      if(actionVersion===sessionVersion&&attemptVersion===authAttemptVersion)button.disabled=false;
    }
  });
  $("verifyForm").addEventListener("submit",async event=>{
    event.preventDefault();
    const actionVersion=sessionVersion;
    const attemptVersion=++authAttemptVersion;
    const button=$("verifyForm").querySelector('button[type="submit"]');
    button.disabled=true;
    $("loginStatus").textContent="Verifying code…";
    try {
      const result=await api("/api/v1/agency/team/auth/verify-code",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value.trim(),code:$("code").value.trim()})},actionVersion);
      assertCurrentSession(actionVersion);
      if(attemptVersion!==authAttemptVersion)return;
      if(!result.access_token)throw new Error("The server did not return an agency session.");
      token=result.access_token;
      sessionStorage.setItem(tokenKey,token);
      await showSignedIn(actionVersion);
    } catch(error) {
      if(actionVersion===sessionVersion&&attemptVersion===authAttemptVersion)$("loginStatus").textContent=error.message;
    } finally {
      if(actionVersion===sessionVersion&&attemptVersion===authAttemptVersion)button.disabled=false;
    }
  });
  $("logout").addEventListener("click",async()=>{const logoutToken=token;showSignedOut();if(logoutToken){try{await fetch("/api/v1/agency/team/auth/logout",{method:"POST",cache:"no-store",headers:{Authorization:"Bearer "+logoutToken}});}catch(_){}}});
  if(token)showSignedIn();
})();
</script>
</body></html>
